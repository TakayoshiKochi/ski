name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.cc }}${{ matrix.std && format(' {0}', matrix.std) || '' }}
    # The runner is self-hosted and this repository is public, so skip
    # pull requests from forks.  A fork can edit this file and drop the
    # condition; the real protection is the repository setting that makes
    # fork pull request workflows wait for a maintainer's approval.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64]
    container: ubuntu:26.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - cc: gcc
          - cc: gcc
            std: -std=gnu2x
          - cc: clang
            std: -std=gnu2x
    env:
      CC: ${{ matrix.cc }}
      CFLAGS: -O2 -g ${{ matrix.std }}
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git ca-certificates \
            build-essential autoconf automake libtool libtool-bin \
            libelf-dev gperf bison flex libncurses-dev gawk pkg-config \
            clang

      - uses: actions/checkout@v4

      - name: Configure
        run: |
          autoreconf -fi
          ./configure

      - name: Build
        run: make -j"$(nproc)"

      - name: Test
        run: make check

      - name: Show test logs
        if: failure()
        run: cat testsuite/test-suite.log testsuite/*.log 2>/dev/null || true

  distcheck:
    # The runner is self-hosted and this repository is public, so skip
    # pull requests from forks.  A fork can edit this file and drop the
    # condition; the real protection is the repository setting that makes
    # fork pull request workflows wait for a maintainer's approval.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64]
    container: ubuntu:26.04
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git ca-certificates \
            build-essential autoconf automake libtool libtool-bin \
            libelf-dev gperf bison flex libncurses-dev gawk pkg-config

      - uses: actions/checkout@v4

      - name: Distcheck
        run: |
          autoreconf -fi
          ./configure
          make -j"$(nproc)" distcheck
