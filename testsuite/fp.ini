# Assemble fma/fmax/fmin at the entry point (numbers are hex) and
# run them on f6 = 2.0, f7 = 3.0; f1 is always 1.0.  Quit afterwards,
# since the program cannot continue from the overwritten entry point.
=t ip mfi
=i ip "nop.m 0" "fma.d.s0 f8 = f6, f7, f1" "nop.i 0"
=t ip+10 mfi
=i ip+10 "nop.m 0" "fmax.s0 f9 = f6, f7" "nop.i 0"
=t ip+20 mfi
=i ip+20 "nop.m 0" "fmin.s0 f10 = f6, f7" "nop.i 0"
= f6.e 0x10000
= f6.m 0x8000000000000000
= f7.e 0x10000
= f7.m 0xc000000000000000
step 9
eval f8.e
eval f8.m
eval f9.e
eval f9.m
eval f10.e
eval f10.m
quit
