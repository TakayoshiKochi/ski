# A dynamic-loader debug event (break 0x70327, out0 = 4 for "load
# complete") is not a system call and must leave r8 and r10 alone.
=t ip mii
=i ip "alloc r33 = ar.pfs, 0, 0, 2, 0" "adds r32 = 4, r0" "adds r8 = 1234, r0"
=t ip+10 mii
=i ip+10 "nop.m 0" "adds r10 = 5678, r0" "break.i 0x70327"
step 6
eval r8
eval r10
quit
